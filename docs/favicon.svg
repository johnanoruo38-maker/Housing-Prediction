<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c4500a"/>
      <stop offset="100%" style="stop-color:#e8620c"/>
    </linearGradient>
  </defs>

  <!-- Bold orange circle background -->
  <circle cx="16" cy="16" r="16" fill="url(#bg)"/>

  <!-- Bold white house roof -->
  <polygon points="16,5 5,14 27,14" fill="#ffffff"/>

  <!-- Bold white house body -->
  <rect x="7" y="14" width="18" height="13" rx="1" fill="#ffffff"/>

  <!-- Bold orange door -->
  <rect x="12" y="19" width="8" height="8" rx="1" fill="url(#bg)"/>

  <!-- Two bold white windows -->
  <rect x="8" y="16" width="5" height="4" rx="0.5" fill="url(#bg)"/>
  <rect x="19" y="16" width="5" height="4" rx="0.5" fill="url(#bg)"/>
</svg>
