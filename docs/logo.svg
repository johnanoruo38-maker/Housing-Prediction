<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60" width="220" height="60">
  <defs>
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c4500a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8620c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1611;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2318;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.25)"/>
    </filter>
  </defs>

  <!-- Icon background circle -->
  <circle cx="30" cy="30" r="26" fill="url(#bgGrad)" />

  <!-- Roof -->
  <polygon points="30,10 14,24 46,24" fill="url(#houseGrad)" filter="url(#shadow)" />
  <line x1="30" y1="10" x2="30" y2="24" stroke="#ff8040" stroke-width="0.8" opacity="0.5"/>

  <!-- House body -->
  <rect x="16" y="24" width="28" height="18" rx="1.5" fill="#fff8f3" />

  <!-- Left window -->
  <rect x="18.5" y="27" width="7" height="7" rx="1" fill="url(#houseGrad)" opacity="0.9"/>
  <line x1="22" y1="27" x2="22" y2="34" stroke="#fff" stroke-width="0.8" opacity="0.6"/>
  <line x1="18.5" y1="30.5" x2="25.5" y2="30.5" stroke="#fff" stroke-width="0.8" opacity="0.6"/>

  <!-- Right window -->
  <rect x="34.5" y="27" width="7" height="7" rx="1" fill="url(#houseGrad)" opacity="0.9"/>
  <line x1="38" y1="27" x2="38" y2="34" stroke="#fff" stroke-width="0.8" opacity="0.6"/>
  <line x1="34.5" y1="30.5" x2="41.5" y2="30.5" stroke="#fff" stroke-width="0.8" opacity="0.6"/>

  <!-- Door -->
  <rect x="24.5" y="33" width="11" height="9" rx="1.5" fill="#c4500a"/>
  <circle cx="33.5" cy="38" r="1" fill="#ffcc88"/>

  <!-- Ground line -->
  <line x1="12" y1="42" x2="48" y2="42" stroke="url(#houseGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Small chart bars suggesting ML/data -->
  <rect x="13" y="37" width="3" height="5" rx="0.8" fill="#e8620c" opacity="0.7"/>
  <rect x="44" y="34" width="3" height="8" rx="0.8" fill="#e8620c" opacity="0.7"/>

  <!-- Brand name -->
  <text x="66" y="24" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#1a1611" letter-spacing="-0.5">Estimate</text>
  <text x="164" y="24" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#c4500a" letter-spacing="-0.5">IQ</text>

  <!-- Divider -->
  <line x1="66" y1="28" x2="210" y2="28" stroke="#e2d9cc" stroke-width="0.8"/>

  <!-- Tagline -->
  <text x="67" y="39" font-family="Arial, sans-serif" font-size="7.8" font-weight="500" fill="#7a6f62" letter-spacing="1.5">JAI-POWERED PROPERTY VALUATION</text>
</svg>
