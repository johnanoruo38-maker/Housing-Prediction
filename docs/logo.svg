<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="340" height="70">
  <defs>
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c4500a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8620c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1611;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2318;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.25)"/>
    </filter>
  </defs>

  <!-- Icon background circle -->
  <circle cx="35" cy="35" r="30" fill="url(#bgGrad)" />

  <!-- Roof -->
  <polygon points="35,13 17,28 53,28" fill="url(#houseGrad)" filter="url(#shadow)" />
  <line x1="35" y1="13" x2="35" y2="28" stroke="#ff8040" stroke-width="0.8" opacity="0.5"/>

  <!-- House body -->
  <rect x="19" y="28" width="32" height="20" rx="1.5" fill="#fff8f3" />

  <!-- Left window -->
  <rect x="22" y="31" width="8" height="8" rx="1" fill="url(#houseGrad)" opacity="0.9"/>
  <line x1="26" y1="31" x2="26" y2="39" stroke="#fff" stroke-width="0.8" opacity="0.6"/>
  <line x1="22" y1="35" x2="30" y2="35" stroke="#fff" stroke-width="0.8" opacity="0.6"/>

  <!-- Right window -->
  <rect x="40" y="31" width="8" height="8" rx="1" fill="url(#houseGrad)" opacity="0.9"/>
  <line x1="44" y1="31" x2="44" y2="39" stroke="#fff" stroke-width="0.8" opacity="0.6"/>
  <line x1="40" y1="35" x2="48" y2="35" stroke="#fff" stroke-width="0.8" opacity="0.6"/>

  <!-- Door -->
  <rect x="28" y="38" width="14" height="10" rx="1.5" fill="#c4500a"/>
  <circle cx="40" cy="44" r="1.2" fill="#ffcc88"/>

  <!-- Ground line -->
  <line x1="14" y1="48" x2="56" y2="48" stroke="url(#houseGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Chart bars -->
  <rect x="15" y="42" width="3.5" height="6" rx="1" fill="#e8620c" opacity="0.7"/>
  <rect x="52" y="39" width="3.5" height="9" rx="1" fill="#e8620c" opacity="0.7"/>

  <!-- Brand name: Estimate -->
  <text x="78" y="28" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#1a1611" letter-spacing="-0.5">Estimate</text>

  <!-- Brand name: IQ in accent color -->
  <text x="200" y="28" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#c4500a" letter-spacing="-0.5">IQ</text>

  <!-- Divider line -->
  <line x1="78" y1="33" x2="330" y2="33" stroke="#e2d9cc" stroke-width="0.8"/>

  <!-- Tagline — full text with enough space -->
  <text x="78" y="48" font-family="Arial, sans-serif" font-size="9" font-weight="500" fill="#7a6f62" letter-spacing="1.8">JAI-POWERED PROPERTY VALUATION</text>
</svg>
